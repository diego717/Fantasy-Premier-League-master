name: Fetch Data

# Twice a week during the season (August to May) the current season is pulled
# from the FPL API, the dashboard datasets are rebuilt and the result is
# committed. It can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: '0 6 * 1-5,8-12 2,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetchData:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch current season and rebuild the dashboard data
        run: python scripts/build_all.py --fetch-current

      - name: Check the generated data
        run: python -m unittest discover tests

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          gameweek_id=$(python gameweek.py)
          git commit -m "gh-actions: data up to gw${gameweek_id}"
          git push
